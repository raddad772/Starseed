<!doctype html><meta charset="utf-8"><title>Orbital loading and garage regression</title>
<style>body{background:#101b22;color:#dae5f4;font:14px system-ui}iframe{width:1200px;height:800px;border:0}pre{white-space:pre-wrap}</style>
<button id="run">Run orbital loading and garage checks</button><button id="release" disabled>Release test history</button><pre id="status">Ready</pre><iframe title="Owned loading test"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),release=document.querySelector('#release');
document.querySelector('#run').onclick=()=>{
 status.textContent='Running…';
 frame.onload=()=>{const s=frame.contentDocument.createElement('script');s.type='module';s.src='/tools/orbital-loading-driver.js';frame.contentDocument.body.append(s);};
 frame.src='/?seed=SOL&workers=2&worldsim=0';
};
release.onclick=()=>{frame.contentWindow.postMessage({type:'release-orbital-history'},location.origin);release.disabled=true;};
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data.type==='orbital-loading'){status.textContent=JSON.stringify(e.data.report,null,2);release.disabled=!e.data.report.canRelease;}});
</script>
