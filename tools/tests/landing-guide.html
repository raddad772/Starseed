<!doctype html><meta charset="utf-8"><title>Landing guide validation</title>
<style>body{margin:0;background:#101c23;color:#dcebf0;font:14px monospace}header{padding:16px}iframe{border:0;width:1280px;height:800px}img{max-width:100%}pre{white-space:pre-wrap}</style>
<header><b>Manual landing guide — finite native game test</b> <button id="run">Run validation</button><pre id="status">Ready</pre></header>
<div id="shots"></div><iframe title="Landing guide test game"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),button=document.querySelector('#run');
button.onclick=()=>{
 button.disabled=true;status.textContent='Starting the game with two workers…';
 frame.onload=()=>{const script=frame.contentDocument.createElement('script');script.type='module';script.src='/tools/landing-guide-driver.js';frame.contentDocument.body.append(script);};
 frame.src='/?seed=SOL&workers=2&date=2026-10-06T23:08';
};
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data.type!=='landing-guide-test')return;
 const {report,image,name}=event.data;status.textContent=JSON.stringify(report,null,2);
 if(image){const img=new Image();img.src=image;img.alt=name;document.querySelector('#shots').append(img);}
 if(report.stage==='Passed'||report.stage==='Failed')button.disabled=false;
});
</script>
