<style>body{margin:0;background:#131c1d;color:#deeddf;font:14px monospace}iframe{width:1280px;height:800px;border:0}pre{padding:15px;white-space:pre-wrap}img{width:640px;max-width:100%}</style>
<pre id="result">Preparing the finite native WebGPU fixture…</pre><iframe id="game"></iframe>
<script type="module">
import { walkLine,walkRoute,flyTo,advance,retrieveSiteRecord,jumpTo,climbCollection,descendCollection,walkOblique,enterBunker,solveGravityRoute } from './understructure-walk.js';

const out=document.querySelector('#result'),iframe=document.querySelector('#game');let test;
const base=`../../understructure.html?seed=${encodeURIComponent(seed)}&theme=${theme}&test=1&environment=${params.get('environment')||'living'}`;iframe.src=base+'&reset=1';

try {
 await ready();test.pause();const {sim,renderer,visual}=test;
 async function capture(name){test.render();await renderer.device.queue.onSubmittedWorkDone();const shot=await renderer.capture();let visible=0;for(let i=0;i<shot.pixels.length;i+=4)if(Math.max(shot.pixels[i],shot.pixels[i+1],shot.pixels[i+2])>25)visible++;check(visible>shot.width*shot.height*.02,name+' is effectively black');const src=await renderer.captureURL();report.images.push(name);const img=document.createElement('img');img.alt=name;img.src=src;document.body.append(img);(window.captures??={})[name]=src;}
 await capture('surface');enterBunker(sim);check(sim.inBunker&&!sim.jetpackEnabled,'Bunker entry failed');sim.yaw=0;sim.pitch=-.08;await capture('bunker');check(renderer.localLights.shadows.stats.lights>0&&renderer.localLights.shadows.stats.draws>0,'Local shadows did not draw');const shadowed=await renderer.capture();visual.scene.userData.localShadows=false;test.render();await renderer.device.queue.onSubmittedWorkDone();const lit=await renderer.capture();let changed=0;for(let i=0;i<lit.pixels.length;i+=4)if(lit.pixels[i]>shadowed.pixels[i]+12)changed++;check(changed>100,'Shadow maps do not darken occluded surfaces');visual.scene.userData.localShadows=true;report.shadows={changedPixels:changed};report.checks.push('Visible fixtures and current-frame local shadow occlusion');walkLine(sim,0,0);check(sim.onPlatform,'Cannot board lift');sim.interact();advance(sim,LIFT_SECONDS/2);check(Math.abs(sim.pos[1]-(DECK+ACCESS.top)/2)<.1,'Lift not continuous');sim.yaw=-Math.PI/2;await capture('shaft');sim.yaw=0;advance(sim,LIFT_SECONDS/2+.1);check(sim.pos[1]===DECK,'Lift did not stop');walkLine(sim,0,-20);sim.interact();await capture('culvert');check(sim.fragments.has('entry-signal')&&sim.rawData===1,'First automatic Golden Path unit missing');report.checks.push('Person-sized hatch, access bunker, jetpack lock, 4.2 s continuous lift and walkable exit');if(params.get('inspect')==='scan')throw Error('MANUAL_INSPECTION');
 walkRoute(sim,-60,-204);walkLine(sim,-62,-204);for(const r of sim.plan.routes){walkLine(sim,r.b[0],r.b[2]);if(r.id==='collection-route-2'){sim.yaw=0;sim.pitch=-.25;await capture('service-basement');}}walkLine(sim,56,-268);check(sim.offer()?.type==='archive_data','Upper archive unreachable');sim.interact();check(!sim.dataRecovered&&!sim.teleport(),'Retrieval gate bypassed');walkLine(sim,10,-268);walkLine(sim,10,-266.6);sim.yaw=Math.PI+.12;sim.pitch=-.34;await capture('upper-crossing');if(params.get('inspect')==='upper')throw Error('MANUAL_INSPECTION');
 const hall=sim.plan.generator;check(hall.cores.filter(c=>c.active).length===1,'Expected one surviving generator');check(visual.generator.live.name==='surviving-generator-'+hall.active,'Wrong live generator rendered');
 walkLine(sim,0,-268);sim.yaw=Math.PI;sim.pitch=-.2;const savedTime=sim.time;sim.time=(9-hall.phase+hall.period)%hall.period;await capture('generator-surge');const peak=visual.generator.reading.power;sim.time=(17-hall.phase+hall.period)%hall.period;await capture('generator-fading');check(peak-visual.generator.reading.power>.7,'Core restart envelope missing');sim.time=savedTime;
 walkLine(sim,0,-282);sim.yaw=0;sim.pitch=-.1;await capture('geological-breach');walkLine(sim,0,-307);sim.yaw=Math.PI/2;sim.pitch=-.16;await capture('groundwater-flow');const groundwater=visual.generator.groundwater;if(groundwater.streams.length){const before=Array.from(groundwater.streaks.instanceMatrix.array);advance(sim,.2);await capture('groundwater-flow-next');check(before.some((v,i)=>Math.abs(v-groundwater.streaks.instanceMatrix.array[i])>.01),'Groundwater must visibly move');report.checks.push('Groundwater falls downward with animated impact and pool ripples');}walkLine(sim,0,-330);check(sim.offer()?.id==='rupture','Fault lookout is unreachable');sim.interact();sim.yaw=0;sim.pitch=-.15;await capture('fault-lookout');check(sim.lookoutSeen,'Lookout not surveyed');if(params.get('inspect')==='lookout')throw Error('MANUAL_INSPECTION');walkLine(sim,0,-268);report.generator={active:hall.active,wound:hall.wound,environment:hall.environment};report.checks.push('One seeded surviving generator, slow restart lighting, walkable fault lookout and return');descendCollection(sim);walkRoute(sim,0,-264);sim.yaw=-.4;sim.pitch=-.1;await capture('reservoir');report.checks.push('Repository and shortcut locked until local circuits are restored');
 for(const [x,z] of [[0,-284],[-62,-284],[-62,-204],[0,-204],[62,-204],[62,-284],[0,-284]])walkLine(sim,x,z);
 for(const yaw of [0,Math.PI/2,Math.PI,-Math.PI/2,0]){sim.yaw=yaw;test.render();await renderer.device.queue.onSubmittedWorkDone();check(renderer.stats.calls>0,'Turn lost geometry');}report.checks.push('All reservoir catwalk loops and immediate camera turns');
 walkRoute(sim,-40,20);sim.yaw=0;sim.pitch=.06;await capture('pipe-gallery');walkRoute(sim,-56,40);sim.yaw=-2.4;sim.pitch=-.52;await capture('data-crawler');const raw=sim.rawData;check(sim.offer()?.text.includes('crawler log'),'One-unit find should come from a crawler');sim.interact();check(sim.rawData===raw+1,'Dead-end fragment failed');walkRoute(sim,-40,-4);await capture('maintenance-intrusion');report.checks.push('Narrow optional intrusion, pipe gallery and one-unit dead-end fragment');
 walkRoute(sim,-56,40);for(const id of ['wedge','hexwell','pentagon']){const room=sim.plan.oblique.rooms.find(r=>r.id===id);walkOblique(sim,...room.center);sim.yaw=id==='hexwell'?1.2:.4;sim.pitch=id==='hexwell'?-.17:-.05;await capture('oblique-'+id);check(sim.sectorsSeen.has(id),'Polygon room not surveyed');}walkOblique(sim,-56,40);report.checks.push('Triangular, pentagonal and hexagonal rooms, oblique corridors, crossed bridges and normal walking return');
 walkRoute(sim,24,-52);sim.interact();walkRoute(sim,76,-52);walkLine(sim,82,-52);sim.yaw=-Math.PI/2;sim.pitch=.2;await capture('null-well-entry');
 if(params.get('inspect')==='null'){out.textContent='Manual flight inspection ready';throw Error('MANUAL_INSPECTION');}
 if(sim.zeroG){flyTo(sim,[96,DECK+.05,-52]);flyTo(sim,[77,DECK+.05,-52]);walkLine(sim,76,-52);solveGravityRoute(sim);await capture('vertical-route-complete');report.checks.push('Zero-g ascent, low-gravity return crossing, banked gallery and shielded shaft descent');}
 else{walkLine(sim,96,-52);sim.interact();walkLine(sim,108,-52);sim.yaw=-Math.PI/2;sim.pitch=-.17;await capture('megavault');walkLine(sim,76,-52);}
 walkRoute(sim,-76,-28);walkLine(sim,-81,-28);sim.yaw=Math.PI/2;sim.pitch=.17;await capture('upfall-cistern');walkLine(sim,-81,-41);walkLine(sim,-96,-41);if(sim.plan.themes.includes('pressure')){for(let i=0;i<3&&!sim.solved.has('pressure');i++)sim.interact();check(sim.solved.has('pressure'),'Pressure valve failed');report.checks.push('Pressure reference and valve restored');}if(!sim.recorded.has('upfall'))sim.interact();sim.interact();const flow=sim.flowTime;advance(sim,1);check(sim.flowTime===flow,'Valve did not hold');sim.interact();walkLine(sim,sim.pos[0],-38.8);walkLine(sim,-81,-38.8);walkLine(sim,-81,-28);walkLine(sim,-76,-28);report.checks.push('Cistern dry rim, valve and themed water motion');
 if(sim.plan.themes.includes('time')){walkRoute(sim,-76,-100);walkLine(sim,-96,-100);test.render();check(!iframe.contentDocument.getElementById('phasePanel').hidden,'Timing gauge missing');while(!sim.phase.ready)sim.step(1/60);sim.interact();advance(sim,.5);sim.yaw=.5;sim.pitch=.2;await capture('resonance-hall');walkLine(sim,-76,-100);report.checks.push('Readable phase gauge, forgiving time alignment and persistent circuit');}
 if(sim.plan.themes.includes('space')){walkRoute(sim,-76,-100);walkLine(sim,-104,-100);walkLine(sim,-104,-108);sim.yaw=0;sim.pitch=0;sim.interact();await capture('fold-gate');const before=sim.foldCount;for(let i=0;i<120&&sim.foldCount===before;i++)sim.step(1/60,{forward:1});check(sim.foldCount>before,'Fold did not cross');sim.interact();await capture('fold-exit');walkLine(sim,sim.pos[0],-38.8);walkLine(sim,-81,-38.8);walkLine(sim,-81,-28);walkLine(sim,-76,-28);report.checks.push('Paired folded threshold changes room and reconnects far terminal');}
 if(sim.plan.themes.includes('light')){walkRoute(sim,76,-20);walkLine(sim,84,-20);sim.yaw=-Math.PI/2;sim.pitch=-.1;await capture('bridge-off');sim.interact();walkLine(sim,106,-20);sim.interact();await capture('hard-light-bridge');walkLine(sim,134,-20);sim.interact();walkLine(sim,76,-20);report.checks.push('Two latched light bridges crossed and far return connected');}
 if(sim.plan.themes.includes('resonance')){walkRoute(sim,-76,-100);const p=sim.plan.puzzles.find(p=>p.id==='resonance');for(const i of p.order){walkLine(sim,p.plates[i][0],p.plates[i][2]);sim.interact();}check(sim.solved.has('resonance'),'Resonance sequence failed');sim.yaw=0;sim.pitch=0;await capture('resonance-sequence');walkLine(sim,-76,-100);report.checks.push('Displayed resonance sequence followed without memory guessing');}
 const doc=iframe.contentDocument;doc.getElementById('mapButton').click();test.render();const map=doc.getElementById('map'),initialMap=map.toDataURL();map.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check(map.toDataURL()!==initialMap,'Map orbit did not change view');map.dispatchEvent(new KeyboardEvent('keydown',{key:'+',bubbles:true}));const select=doc.querySelector('[aria-label="Map level"]');select.value='raised';select.dispatchEvent(new Event('change'));check(map.toDataURL()!==initialMap,'Map level filter did not change view');select.value='all';select.dispatchEvent(new Event('change'));(window.captures??={})['survey-map']=map.toDataURL();const mapImg=document.createElement('img');mapImg.alt='survey-map';mapImg.src=window.captures['survey-map'];document.body.append(mapImg);report.images.push('survey-map');report.checks.push('3D survey map orbit, zoom and level filtering');if(params.get('inspect')==='map')throw Error('MANUAL_INSPECTION');doc.querySelector('[data-close="mapPanel"]').click();
 check(sim.archiveReady,'Repository did not unlock');retrieveSiteRecord(sim);check(sim.exitReady&&sim.rawData>=90&&sim.rawData<100,'Central cache must unlock return without 100% recovery');test.save();test.render();check(iframe.contentDocument.getElementById('objective').textContent.includes('Central record secured'),'Retrieval objective absent');await capture('site-record');if(params.get('inspect')==='record')throw Error('MANUAL_INSPECTION');check(sim.beacon(),'Beacon failed');visual.addBeacon(sim.beacons.at(-1));check(sim.teleport(),'Shortcut failed');test.save();await capture('survey-returned');report.checks.push('Central cache awards 90 units and unlocks return below 100%');
 iframe.contentDocument.getElementById('mapButton').click();check(!iframe.contentDocument.getElementById('mapPanel').hidden,'Map failed');iframe.contentDocument.querySelector('[data-close="mapPanel"]').click();iframe.contentDocument.getElementById('notesButton').click();check(iframe.contentDocument.querySelectorAll('#notes article').length===sim.recorded.size,'Journal mismatch');iframe.contentDocument.querySelector('[data-close="notesPanel"]').click();report.checks.push('Survey map, optional observations and journal');
 check(!test.errors.length,JSON.stringify(test.errors));report.errors=[...test.errors];report.stats=renderer.stats;const previous=test,saved=sim.save();iframe.src=base;await ready(previous);test.pause();check(test.sim.returned&&test.sim.dataRecovered&&test.sim.solved.size===saved.solved.length,'Reload lost retrieved data');check(test.sim.recorded.size===saved.recorded.length&&test.sim.beacons.length===saved.beacons.length,'Reload lost journal/beacons');check(!test.errors.length,JSON.stringify(test.errors));report.checks.push('Actual page reload restores record, circuits, map, observations and beacons');

} catch(e){test?.pause();window.testResult={status:e.message==='MANUAL_INSPECTION'?'inspection':'failed',error:e.message==='MANUAL_INSPECTION'?undefined:e.stack,...report};out.textContent=JSON.stringify(window.testResult,null,2);}
</script>
