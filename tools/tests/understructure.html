<!doctype html><meta charset="utf-8"><title>Understructure finite validation</title>
<style>body{margin:0;background:#131c1d;color:#deeddf;font:14px monospace}iframe{width:1280px;height:800px;border:0}pre{padding:15px;white-space:pre-wrap}img{width:640px;max-width:100%}</style>
<pre id="result">Preparing the finite native WebGPU fixture…</pre><iframe id="game"></iframe>
<script type="module">
import { walkLine,walkRoute,flyTo,advance,retrieveSiteRecord } from './understructure-walk.js';
import { DECK,LIFT_SECONDS } from '../../src/understructure/layout.js';
const params=new URLSearchParams(location.search),theme=params.get('theme')||'gravity-time';
const out=document.querySelector('#result'),iframe=document.querySelector('#game');let test;
const base=`../../understructure.html?seed=SUMP-07&theme=${theme}&test=1`;iframe.src=base+'&reset=1';
const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,msg)=>{if(!v)throw Error(msg);};
const report={theme,checks:[],images:[]};window.testResult={status:'running'};
async function ready(previous){for(let i=0;i<300;i++){const next=iframe.contentWindow?.understructureTest;if(next&&next!==previous&&next.renderer&&next.frame){test=next;return;}await wait(100);}throw Error('Native renderer did not start');}
try {
 await ready();test.pause();const {sim,renderer,visual}=test;
 async function capture(name){test.render();await renderer.device.queue.onSubmittedWorkDone();const shot=await renderer.capture();let visible=0;for(let i=0;i<shot.pixels.length;i+=4)if(Math.max(shot.pixels[i],shot.pixels[i+1],shot.pixels[i+2])>25)visible++;check(visible>shot.width*shot.height*.02,name+' is effectively black');const src=await renderer.captureURL();report.images.push(name);const img=document.createElement('img');img.alt=name;img.src=src;document.body.append(img);(window.captures??={})[name]=src;}
 await capture('surface');walkLine(sim,0,4);check(sim.offer()?.type==='hatch','Hatch unreachable');sim.interact();advance(sim,1.5);walkLine(sim,0,0);check(sim.onPlatform,'Cannot board lift');sim.interact();advance(sim,LIFT_SECONDS/2);check(Math.abs(sim.pos[1]-DECK/2)<.1,'Lift not continuous');await capture('shaft');advance(sim,LIFT_SECONDS/2+.1);check(sim.pos[1]===DECK,'Lift did not stop');walkLine(sim,0,-20);sim.interact();await capture('culvert');report.checks.push('Person-sized hatch, 4.2 s / 240 m continuous lift and walkable exit');
 walkRoute(sim,0,-264);check(sim.offer()?.type==='archive_data','Repository unreachable');sim.interact();check(!sim.dataRecovered&&!sim.teleport(),'Retrieval gate bypassed');sim.yaw=-.4;sim.pitch=-.1;await capture('reservoir');report.checks.push('Repository and shortcut locked until local circuits are restored');
 for(const [x,z] of [[0,-284],[-62,-284],[-62,-204],[0,-204],[62,-204],[62,-284],[0,-284]])walkLine(sim,x,z);
 for(const yaw of [0,Math.PI/2,Math.PI,-Math.PI/2,0]){sim.yaw=yaw;test.render();await renderer.device.queue.onSubmittedWorkDone();check(renderer.stats.calls>0,'Turn lost geometry');}report.checks.push('All reservoir catwalk loops and immediate camera turns');
 walkRoute(sim,24,-52);sim.interact();walkRoute(sim,76,-52);walkLine(sim,82,-52);sim.yaw=-Math.PI/2;sim.pitch=.2;await capture('null-well-entry');
 if(params.get('inspect')==='null'){out.textContent='Manual flight inspection ready';throw Error('MANUAL_INSPECTION');}
 if(sim.zeroG){flyTo(sim,sim.plan.puzzles.find(p=>p.id==='gravity').source);check(sim.offer()?.type==='cell','Floating cell unreachable');sim.interact();sim.yaw=Math.PI/2;sim.pitch=-.4;await capture('null-well-flight');flyTo(sim,[106,DECK+10,-52]);sim.yaw=-Math.PI/2;sim.pitch=-.17;await capture('megavault');flyTo(sim,[96,DECK+.05,-52]);flyTo(sim,[82,DECK+.05,-52]);sim.interact();check(sim.solved.has('gravity'),'Cell socket failed');flyTo(sim,[77,DECK+.05,-52]);walkLine(sim,76,-52);report.checks.push('Zero-g flight, elevated cell retrieval, socket and safe gravity return');}
 else{walkLine(sim,96,-52);sim.interact();walkLine(sim,108,-52);sim.yaw=-Math.PI/2;sim.pitch=-.17;await capture('megavault');walkLine(sim,76,-52);}
 walkRoute(sim,-76,-28);walkLine(sim,-81,-28);sim.yaw=Math.PI/2;sim.pitch=.17;await capture('upfall-cistern');walkLine(sim,-81,-41);walkLine(sim,-96,-41);sim.interact();sim.interact();const flow=sim.flowTime;advance(sim,1);check(sim.flowTime===flow,'Valve did not hold');sim.interact();walkLine(sim,sim.pos[0],-38.8);walkLine(sim,-81,-38.8);walkLine(sim,-81,-28);walkLine(sim,-76,-28);report.checks.push('Cistern dry rim, valve and themed water motion');
 if(sim.plan.themes.includes('time')){walkRoute(sim,-76,-100);walkLine(sim,-96,-100);test.render();check(!iframe.contentDocument.getElementById('phasePanel').hidden,'Timing gauge missing');while(!sim.phase.ready)sim.step(1/60);sim.interact();advance(sim,.5);sim.yaw=.5;sim.pitch=.2;await capture('resonance-hall');walkLine(sim,-76,-100);report.checks.push('Readable phase gauge, forgiving time alignment and persistent circuit');}
 if(sim.plan.themes.includes('space')){walkRoute(sim,-76,-100);walkLine(sim,-104,-100);walkLine(sim,-104,-108);sim.yaw=0;sim.pitch=0;sim.interact();await capture('fold-gate');const before=sim.foldCount;for(let i=0;i<120&&sim.foldCount===before;i++)sim.step(1/60,{forward:1});check(sim.foldCount>before,'Fold did not cross');sim.interact();await capture('fold-exit');walkLine(sim,sim.pos[0],-38.8);walkLine(sim,-81,-38.8);walkLine(sim,-81,-28);walkLine(sim,-76,-28);report.checks.push('Paired folded threshold changes room and reconnects far terminal');}
 check(sim.archiveReady,'Repository did not unlock');retrieveSiteRecord(sim);check(sim.exitReady,'Data retrieval failed');test.render();check(iframe.contentDocument.getElementById('objective').textContent.includes('Site record secured'),'Retrieval objective absent');await capture('site-record');if(params.get('inspect')==='record')throw Error('MANUAL_INSPECTION');check(sim.beacon(),'Beacon failed');visual.addBeacon(sim.beacons.at(-1));check(sim.teleport(),'Shortcut failed');test.save();await capture('survey-returned');report.checks.push('Retrieved site record unlocks optional surface return');
 iframe.contentDocument.getElementById('mapButton').click();check(!iframe.contentDocument.getElementById('mapPanel').hidden,'Map failed');iframe.contentDocument.querySelector('[data-close="mapPanel"]').click();iframe.contentDocument.getElementById('notesButton').click();check(iframe.contentDocument.querySelectorAll('#notes article').length===sim.recorded.size,'Journal mismatch');iframe.contentDocument.querySelector('[data-close="notesPanel"]').click();report.checks.push('Survey map, optional observations and journal');
 check(!test.errors.length,JSON.stringify(test.errors));report.errors=[...test.errors];report.stats=renderer.stats;const previous=test,saved=sim.save();iframe.src=base;await ready(previous);test.pause();check(test.sim.returned&&test.sim.dataRecovered&&test.sim.solved.size===saved.solved.length,'Reload lost retrieved data');check(test.sim.recorded.size===saved.recorded.length&&test.sim.beacons.length===saved.beacons.length,'Reload lost journal/beacons');check(!test.errors.length,JSON.stringify(test.errors));report.checks.push('Actual page reload restores record, circuits, map, observations and beacons');
 window.testResult={status:'passed',...report};out.textContent=JSON.stringify(window.testResult,null,2);
} catch(e){test?.pause();window.testResult={status:e.message==='MANUAL_INSPECTION'?'inspection':'failed',error:e.message==='MANUAL_INSPECTION'?undefined:e.stack,...report};out.textContent=JSON.stringify(window.testResult,null,2);}
</script>
